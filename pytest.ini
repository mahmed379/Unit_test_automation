[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb
markers =
    smoke: Smoke test suite for critical functionality
    regression: Comprehensive regression test suite
    boundary: Boundary Value Analysis (BVA) test cases
    ecp: Equivalence Class Partitioning (ECP) test cases
    csv_data: Data-driven tests consuming external CSV data
    table: Tests targeting the tinydb.table module
    queries: Tests targeting the tinydb.queries module
    storages: Tests targeting the tinydb.storages module
